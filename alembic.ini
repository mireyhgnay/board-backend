# ════════════════════════════════════════════════════════════════
# 📌 alembic.ini - Alembic 데이터베이스 마이그레이션 설정 파일
#
# 【 Alembic이란? 】
#     SQLAlchemy와 함께 사용하는 DB 마이그레이션 도구입니다.
#
#     마이그레이션(Migration) = DB 스키마(테이블 구조) 변경 이력 관리
#
#     예: User 모델에 phone_number 컬럼을 추가하면
#         Alembic이 자동으로 변경을 감지하고 마이그레이션 파일을 생성합니다.
#         팀원들이 마이그레이션 파일을 실행하면 DB가 동일하게 업데이트됩니다.
#
# 【 주요 명령어 】
#     마이그레이션 파일 자동 생성:
#         alembic revision --autogenerate -m "add phone_number to users"
#
#     DB에 마이그레이션 적용:
#         alembic upgrade head
#
#     이전 버전으로 되돌리기:
#         alembic downgrade -1
#
#     현재 DB 버전 확인:
#         alembic current
#
#     마이그레이션 이력 확인:
#         alembic history
# ════════════════════════════════════════════════════════════════

[alembic]
# 마이그레이션 스크립트가 있는 디렉토리
script_location = alembic

# 마이그레이션 파일 이름 형식: 날짜시간_리비전ID_설명.py
# 예: 20240301_120000_abc123_add_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# DB 연결 URL - 실제로는 env.py에서 .env를 읽어 동적으로 설정됩니다
# 여기에 직접 쓰면 보안상 위험하므로 env.py에서 처리합니다
# ⚠️ 이 값은 alembic/env.py에서 .env의 DATABASE_URL로 자동 덮어씌워집니다.
# 여기에 실제 URL을 쓰지 않아도 됩니다. (보안상 .env에서만 관리)
sqlalchemy.url = postgresql://postgres:password@db.your-project.supabase.co:5432/postgres

# 마이그레이션 파일 생성 시 타임존
timezone = Asia/Seoul

[post_write_hooks]
# 마이그레이션 파일 생성 후 자동으로 코드 포맷팅 실행 (선택사항)
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
